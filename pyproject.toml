[project]
name = "voice-pipeline"
version = "0.1.0"
description = "VoiceRT: local voice pipeline and long-running agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiortc==1.15.0",
    "datasets==5.0.1",
    "deepagents==0.7.16",
    "fastapi==0.141.1",
    "huggingface_hub==1.31.0",
    "httpx==0.28.1",
    "keyring==25.7.0",
    "kokoro==0.9.4; python_version < '3.13'",
    "langchain==1.4.2",
    "langchain-anthropic==1.7.2",
    "langchain-core==1.6.10",
    "langchain-google-genai==4.4.0",
    "langchain-groq==1.1.3",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.7.2",
    "langgraph==1.2.11",
    "matplotlib==3.11.2",
    "mcp==1.30.0",
    "numpy==2.5.3",
    "onnxruntime==1.30.0",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "qrcode==8.2",
    "silero-vad[audio]==6.2.3",
    "soundfile==0.14.0",
    "starlette==1.6.0",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "transformers==5.17.0",
    "triton==3.2.0; sys_platform == 'linux'",
    "uvicorn==0.52.4",
    "websockets>=14,<18",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
