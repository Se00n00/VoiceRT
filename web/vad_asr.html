<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAD → ASR live test</title>
<style>
  body { font-family: monospace; max-width: 760px; margin: 2em auto;
         background: #111; color: #ddd; padding: 0 1em; }
  button { font-size: 1em; padding: .4em 1em; margin-right: .5em; }
  #dot { display: inline-block; width: 18px; height: 18px; border-radius: 50%;
         background: #333; vertical-align: middle; margin-right: .4em; }
  #dot.speech { background: #3f6; box-shadow: 0 0 12px #3f6; }
  #log { border: 1px solid #444; padding: .6em; height: 55vh; overflow-y: auto;
         white-space: pre-wrap; margin-top: 1em; }
  .seg { color: #8cf; } .txt { color: #fff; } .sum { color: #888; }
  .err { color: #f66; } .sys { color: #aa6; }
  .part { color: #999; font-style: italic; }
  .llm { color: #6f6; } .tts { color: #c8f; }
</style>
</head>
<body>
<h2>VAD → ASR live test</h2>
<div>
  <span id="dot"></span><span id="state">idle</span>
</div>
<p>
  <button id="bMic">🎤 start mic</button>
  <button id="bStop" disabled>■ stop turn</button>
  <button id="bBeep" title="local oscillator beep: proves browser audio output works">🔊 test beep</button>
  <label>pause to end turn (s):
    <input id="endSil" type="number" value="2.0" step="0.5" min="0.3"
           max="10" style="width:4em"></label>
  <span id="stat"></span>
  <span id="audioState">audio: n/a</span>
</p>
<div id="log"></div>
<script>
const $ = id => document.getElementById(id);
const logBox = $('log'), dot = $('dot'), state = $('state'), stat = $('stat');
function log(cls, msg) {
  const d = document.createElement('div');
  d.className = cls; d.textContent = msg;
  logBox.appendChild(d); logBox.scrollTop = logBox.scrollHeight;
}
let ws = null, actx = null, src = null, proc = null, stream = null;
let chunks = 0, liveLine = null, replyLine = null;
let playCtx = null, playTail = Promise.resolve(), activeSrc = [];

function showPartial(text) {
  if (!liveLine) {
    liveLine = document.createElement('div');
    liveLine.className = 'part';
    logBox.appendChild(liveLine);
  }
  liveLine.textContent = '… ' + text;
  logBox.scrollTop = logBox.scrollHeight;
}

function showToken(piece) {
  if (!replyLine) {
    replyLine = document.createElement('div');
    replyLine.className = 'llm';
    logBox.appendChild(replyLine);
  }
  replyLine.textContent += piece;
  logBox.scrollTop = logBox.scrollHeight;
}

// TTS frames arrive as raw float32-LE b64 (server _event_frame) + sr.
// Played in arrival order through a promise chain; mic is already
// stopped at commit time so there is no feedback loop.
function setAudioState() {
  $('audioState').textContent =
    'audio: ' + (playCtx ? playCtx.state : 'n/a');
}

function ensurePlayCtx() {
  if (!playCtx) {
    playCtx = new (window.AudioContext || window.webkitAudioContext)();
    playCtx.onstatechange = setAudioState;
  }
  if (playCtx.state === 'suspended') playCtx.resume().catch(() => {});
  setAudioState();
  return playCtx;
}

function b64ToF32(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Float32Array(bytes.buffer);
}

function stopPlayback() {
  activeSrc.forEach(s => { try { s.stop(); } catch {} });
  activeSrc = [];
  playTail = Promise.resolve();
}

function playTts(wav_b64, sr, sentence) {
  const ctx = ensurePlayCtx();
  let data;
  try {
    data = b64ToF32(wav_b64);
  } catch (e) { log('err', 'bad tts audio: ' + e); return; }
  if (!data.length) return;
  const rate = sr || 24000;
  // A suspended context never fires onended: that would wedge the whole
  // queue behind one silent frame. Refuse to queue while blocked.
  if (ctx.state !== 'running') {
    log('err', 'audio output BLOCKED (ctx=' + ctx.state + '): '
      + 'click 🔊 test beep, then talk again');
    return;
  }
  playTail = playTail.then(() => new Promise(resolve => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    // Stall backstop: a source that never ends must not wedge later audio.
    setTimeout(finish, (data.length / rate) * 1000 + 1500);
    try {
      const buf = ctx.createBuffer(1, data.length, rate);
      buf.getChannelData(0).set(data);
      const node = ctx.createBufferSource();
      node.buffer = buf;
      node.connect(ctx.destination);
      activeSrc.push(node);
      node.onended = () => {
        activeSrc = activeSrc.filter(s => s !== node);
        finish();
      };
      node.start();
      log('tts', '▶ playing: ' + (sentence || ''));
    } catch (e) { log('err', 'audio play failed: ' + e); finish(); }
  })).catch(() => {});
}

// Local oscillator beep: proves browser output works with no server
// involved. Real click = real gesture, so this also unlocks the context.
$('bBeep').onclick = () => {
  const ctx = ensurePlayCtx();
  try {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 660;
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.45);
    log('sys', 'beep sent (ctx=' + ctx.state + ') — hear it?');
  } catch (e) { log('err', 'beep failed: ' + e); }
  setAudioState();
};

function connect() {
  return new Promise((resolve, reject) => {
    const url = (location.protocol === 'https:' ? 'wss://' : 'ws://')
      + location.host + '/talk';
    ws = new WebSocket(url);
    ws.onopen = () => {
      log('sys', 'ws open ' + url);
      sendConfig();
      resolve();
    };
    ws.onerror = e => { log('err', 'ws error'); reject(e); };
    ws.onclose = () => { log('sys', 'ws closed'); };
    ws.onmessage = ev => {
      let m;
      try { m = JSON.parse(ev.data); } catch { return; }
      if (m.event === 'ready') { log('sys', 'ready session=' + m.session_id); }
      else if (m.event === 'node' && m.node === 'vad') {
        const speech = m.data && m.data.speech;
        dot.className = speech ? 'speech' : '';
        state.textContent = speech ? 'SPEECH' : 'silence';
      } else if (m.event === 'node' && m.node === 'stt') {
        if (m.kind === 'partial') {
          showPartial(m.data.text);
        } else {
          if (liveLine) { liveLine.remove(); liveLine = null; }
          log('txt', '📝 ' + JSON.stringify(m.data.text)
            + `  (rtf=${Number(m.data.rtf).toFixed(2)})`);
          dot.className = ''; state.textContent = 'idle';
        }
      } else if (m.event === 'node' && m.node === 'llm') {
        if (m.kind === 'token') {
          showToken(m.data.piece || m.data.token || '');
        } else if (m.kind === 'thinking') {
          log('sum', '💭 ' + String(m.data.text || '').slice(0, 120));
        } else if (m.kind === 'done') {
          if (replyLine) { replyLine.remove(); replyLine = null; }
          log('llm', '🤖 ' + m.data.text);
        }
      } else if (m.event === 'node' && m.node === 'tts') {
        log('tts', '🔊 ' + (m.data.sentence || ''));
        if (m.data.wav_b64) playTts(m.data.wav_b64, m.data.sr,
                                    m.data.sentence);
      } else if (m.event === 'node' && m.node === 'term') {
        if (m.kind === 'error') log('err', 'term: ' + (m.data || ''));
        else if (m.kind !== 'token')
          log('sum', `term/${m.kind} ` + JSON.stringify(m.data).slice(0, 160));
      } else if (m.event === 'done') {
        const s = m.summary || {};
        const ns = s.node_s || {};
        log('sum', `— turn done total=${Number(s.total_s).toFixed(0)}ms `
          + `vad=${Number(ns.vad || 0) * 1000 | 0}ms `
          + `stt=${Number(ns.stt || 0) * 1000 | 0}ms `
          + `llm=${Number(ns.llm || 0) * 1000 | 0}ms `
          + `tts=${Number(ns.tts || 0) * 1000 | 0}ms `
          + `reply=${JSON.stringify(s.reply || '')}`);
      } else if (m.event === 'error') {
        log('err', 'error: ' + m.message);
      }
    };
  });
}

// 16 kHz mono int16 frames -> binary ws
function floatTo16(buf) {
  const out = new Int16Array(buf.length);
  for (let i = 0; i < buf.length; i++) {
    const s = Math.max(-1, Math.min(1, buf[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return out;
}

function sendConfig() {
  if (!ws || ws.readyState !== 1) return;
  const es = Math.max(0.3, Number($('endSil').value) || 2.0);
  ws.send(JSON.stringify({ type: 'config', sr: 16000,
                           end_silence_s: es, partial_s: 0.7 }));
  log('sys', `config end_silence_s=${es}s partial_s=0.7s`);
}

$('bMic').onclick = async () => {
  try { if (!ws || ws.readyState !== 1) await connect(); } catch { return; }
  sendConfig();
  ensurePlayCtx();  // user gesture: unlock audio output for the reply
  stopPlayback();   // never play the old reply into the open mic
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  actx = new (window.AudioContext || window.webkitAudioContext)();
  src = actx.createMediaStreamSource(stream);
  proc = actx.createScriptProcessor(4096, 1, 1);
  const inRate = actx.sampleRate, step = Math.round(inRate / 16000);
  let carry = [];
  proc.onaudioprocess = e => {
    const inp = e.inputBuffer.getChannelData(0);
    // naive decimate to 16 kHz
    const frames = [];
    for (let i = 0; i < inp.length; i += step) frames.push(inp[i]);
    const all = carry.concat(frames); carry = [];
    const cut = all.length - (all.length % 512);
    carry = all.slice(cut);
    const blk = all.slice(0, cut);
    if (blk.length && ws && ws.readyState === 1) {
      ws.send(floatTo16(blk).buffer);
      chunks++;
      stat.textContent = (chunks * 512 / 16000).toFixed(1) + 's streamed';
    }
  };
  src.connect(proc); proc.connect(actx.destination);
  $('bMic').disabled = true; $('bStop').disabled = false;
  log('sys', `mic live @${inRate}Hz → 16k PCM frames`);
};

$('bStop').onclick = () => {
  ensurePlayCtx();  // gesture: context running before the reply lands
  try { if (proc) proc.disconnect(); } catch {}
  try { if (src) src.disconnect(); } catch {}
  try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch {}
  try { if (actx) actx.close(); } catch {}
  try { if (ws && ws.readyState === 1)
    ws.send(JSON.stringify({ type: 'commit' })); } catch {}
  proc = src = stream = actx = null; chunks = 0;
  if (liveLine) { liveLine.remove(); liveLine = null; }
  if (replyLine) { replyLine.remove(); replyLine = null; }
  $('bMic').disabled = false; $('bStop').disabled = true;
  log('sys', 'mic stopped → turn committed');
};
</script>
</body>
</html>
