sample_rate: 16000
device: cuda
server:
  host: 0.0.0.0
  port: 8003
legs:
  vad: configs/vad.yaml
  stt: configs/whisper.yaml
  llm: configs/qwen.yaml
  tts: configs/tts.yaml
streaming:
  max_tokens: 48
  sentence_split: "[.!?]+"
vram_budget_mb: 3800
capacity:
  # Per-turn transient scratch estimate (TTS buffers + mel frontend).
  per_turn_mb: 150
  # Fraction / floor of VRAM held back from session math (stability).
  headroom_frac: 0.10
  headroom_min_mb: 400
  # Safety multiplier on the per-session price (history growth).
  safety_factor: 1.25
  # Upper bound on stored sessions even when VRAM allows more (RAM/TTL).
  sessions_cap: 1000
  # Concurrent turns: measured serialization point (c=4 halves throughput).
  max_inflight: 4
  # How long a turn waits in the FIFO queue before 503 + Retry-After.
  queue_timeout_s: 10
